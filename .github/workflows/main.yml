name: Build Android APK

on:
branches: [ main ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
    
    - name: Install Python packages
      run: |
        pip install --upgrade pip
        pip install buildozer cython
    
    - name: Create buildozer.spec
      run: |
        echo '[app]' > buildozer.spec
        echo 'title = Gold Miner' >> buildozer.spec
        echo 'package.name = goldminer' >> buildozer.spec
        echo 'package.domain = com.miner' >> buildozer.spec
        echo 'version = 1.0.0' >> buildozer.spec
        echo 'requirements = python3==3.10,pygame,sdl2,sdl2_image,sdl2_mixer,sdl2_ttf' >> buildozer.spec
        echo 'orientation = portrait' >> buildozer.spec
        echo 'fullscreen = 1' >> buildozer.spec
        echo 'android.api = 33' >> buildozer.spec
        echo 'android.ndk = 25b' >> buildozer.spec
        echo 'android.sdk = 33' >> buildozer.spec
        echo 'android.minapi = 21' >> buildozer.spec
        echo 'android.archs = armeabi-v7a, arm64-v8a' >> buildozer.spec
        echo 'android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE' >> buildozer.spec
        echo 'source.include_exts = py,png,jpg' >> buildozer.spec
    
    - name: Build APK
      run: buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gold-miner-apk
        path: bin/*.apk
        if-no-files-found: error
